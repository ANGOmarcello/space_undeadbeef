# Created by Angelo Cammalleri on 08.11.2026.
name: Package unsigned iOS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Xcode Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent metalToolchain
          fi
      - name: Build and audit the IPA and matching source
        run: python3 script/build_release.py --ref "$GITHUB_SHA" --output "$RUNNER_TEMP/space-deadbeef-release"
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceDeadbeef-${{ github.sha }}
          path: ${{ runner.temp }}/space-deadbeef-release/
          if-no-files-found: error
